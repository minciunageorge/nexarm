name: Inspect CAPSUNA V3 Hiwonder 3D source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strawberry-v3-source-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, nexarm-readonly]
    timeout-minutes: 5
    steps:
      - name: Collect installed 3D gripping source read-only
        run: |
          set -euo pipefail
          mkdir -p artifacts/strawberry-v3-source
          docker exec nexarm bash -lc 'cat /home/ubuntu/ros2_ws/src/example/example/rgbd_function/include/track_and_grab.py' > artifacts/strawberry-v3-source/track_and_grab.py
          docker exec nexarm bash -lc 'cat /home/ubuntu/ros2_ws/src/example/example/rgbd_function/include/utils.py' > artifacts/strawberry-v3-source/utils.py
          docker exec nexarm bash -lc 'cat /home/ubuntu/ros2_ws/src/peripherals/config/camera_info.yaml' > artifacts/strawberry-v3-source/camera_info.yaml
          docker exec nexarm bash -lc 'cat /home/ubuntu/ros2_ws/src/app/config/calibration.yaml' > artifacts/strawberry-v3-source/calibration.yaml
          docker exec nexarm bash -lc 'cat /home/ubuntu/ros2_ws/src/app/config/transform.yaml' > artifacts/strawberry-v3-source/transform.yaml
      - name: Upload source artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strawberry-v3-source-${{ github.run_id }}
          path: artifacts/strawberry-v3-source/
          retention-days: 7
