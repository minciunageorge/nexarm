name: NexArm read-only controller inspection
on:
  push:
    branches: [main]
    paths:
      - '.nexarm/controller-inspect-trigger.txt'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, nexarm-readonly]
    timeout-minutes: 5
    steps:
      - name: Inspect controller without sending motion commands
        shell: bash
        run: |
          set -u
          out="$RUNNER_TEMP/controller-inspect"
          mkdir -p "$out"
          docker exec nexarm bash -lc 'source /opt/ros/humble/setup.bash; source /home/ubuntu/ros2_ws/install/setup.bash; ros2 topic info /ros_robot_controller/arm/set_coords -v' > "$out/set-coords-info.txt" 2>&1 || true
          docker exec nexarm bash -lc 'source /opt/ros/humble/setup.bash; source /home/ubuntu/ros2_ws/install/setup.bash; ros2 node list | sort' > "$out/node-list.txt" 2>&1 || true
          docker exec nexarm bash -lc 'source /opt/ros/humble/setup.bash; source /home/ubuntu/ros2_ws/install/setup.bash; ros2 node info /ros_robot_controller' > "$out/controller-node-info.txt" 2>&1 || true
          docker exec nexarm ps -eo pid,ppid,user,stat,args > "$out/processes.txt" 2>&1 || true
          docker exec nexarm bash -lc 'source /opt/ros/humble/setup.bash; source /home/ubuntu/ros2_ws/install/setup.bash; ros2 topic list | grep -E "ros_robot_controller|servo_controller|controller_manager" | sort' > "$out/controller-topics.txt" 2>&1 || true
          docker exec nexarm bash -lc 'source /opt/ros/humble/setup.bash; source /home/ubuntu/ros2_ws/install/setup.bash; ros2 topic info /ros_robot_controller/bus_servo/set_position -v' > "$out/bus-servo-info.txt" 2>&1 || true
      - name: Upload inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: controller-inspect-${{ github.run_id }}
          path: ${{ runner.temp }}/controller-inspect/
          retention-days: 7
