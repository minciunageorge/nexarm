name: Aurora read-only launch inspection
on:
  push:
    branches: [main]
    paths:
      - '.nexarm/aurora-inspect-trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, nexarm-readonly]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Collect read-only Aurora evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/aurora-inspect
          docker exec nexarm ps -eo pid,ppid,user,stat,args > artifacts/aurora-inspect/processes.txt
          docker exec nexarm id > artifacts/aurora-inspect/docker-exec-id.txt 2>&1 || true
          docker inspect -f '{{.Config.User}}' nexarm > artifacts/aurora-inspect/container-config-user.txt 2>&1 || true
          docker exec nexarm bash -lc 'printf "USER=%s\nHOME=%s\n" "$(id -un)" "$HOME"' > artifacts/aurora-inspect/docker-exec-env.txt 2>&1 || true
          docker exec nexarm bash -lc 'cat /home/ubuntu/ros2_ws/src/peripherals/launch/depth_camera.launch.py' > artifacts/aurora-inspect/depth_camera.launch.py
          docker exec nexarm bash -lc 'cat /home/ubuntu/ros2_ws/src/peripherals/launch/include/aurora930.launch.py' > artifacts/aurora-inspect/hiwonder_aurora930.launch.py
          docker exec nexarm bash -lc 'cat /home/ubuntu/third_party_ros2/third_party_ws/src/deptrum-ros-driver-aurora930-0.2.1001/launch_aurora930/launch/aurora930_launch.py' > artifacts/aurora-inspect/deptrum_direct_aurora930.launch.py
          docker exec nexarm bash -lc 'for p in /proc/[0-9]*; do c=$(cat "$p/comm" 2>/dev/null || true); if [ "$c" = aurora930_node ]; then printf "PID=%s\n" "${p##*/}"; tr "\0" " " < "$p/cmdline" 2>/dev/null || true; printf "\nPPID="; awk "/^PPid:/{print \$2}" "$p/status" 2>/dev/null || true; fi; done' > artifacts/aurora-inspect/aurora-process.txt
          tail -n 200 /home/pi/nexarm-buttons/mode-switch.log > artifacts/aurora-inspect/mode-switch.log 2>&1 || true
          /home/pi/nexarm-buttons/nexarm-mode.sh status > artifacts/aurora-inspect/mode-status.txt 2>&1 || true
          docker exec nexarm bash -lc 'source /opt/ros/humble/setup.bash; source /home/ubuntu/third_party_ros2/third_party_ws/install/setup.bash; timeout 6 ros2 topic hz /aurora/rgb/image_raw' > artifacts/aurora-inspect/aurora-rgb-hz.txt 2>&1 || true
          docker exec nexarm bash -lc 'source /opt/ros/humble/setup.bash; source /home/ubuntu/ros2_ws/install/setup.bash; ros2 topic list | grep -x "/ros_robot_controller/arm/set_coords"' > artifacts/aurora-inspect/controller-topic.txt 2>&1 || true
          docker exec nexarm bash -lc 'tail -n 300 /tmp/nexarm-custom-camera.log 2>/dev/null || true' > artifacts/aurora-inspect/custom-camera.log
          docker exec nexarm bash -lc 'tail -n 300 /tmp/nexarm-factory-camera-restored.log 2>/dev/null || true' > artifacts/aurora-inspect/factory-camera-restored.log
      - name: Upload inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aurora-inspect-${{ github.run_id }}
          path: artifacts/aurora-inspect/
          retention-days: 7
